# application-example.yml
# Copy this to application-local.yml and fill in real values.
# NEVER commit application-local.yml or application-prod.yml

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/medipriority_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: medipriority_user
    password: YourSecurePassword123!

  jpa:
    show-sql: true    # Enable for development; disable in production

app:
  jwt:
    secret: replace-with-a-random-256-bit-string-use-openssl-rand-hex-32
    expiration-ms: 86400000

  cors:
    allowed-origin: http://localhost:5173

logging:
  level:
    com.medipriority: DEBUG
    org.springframework.security: DEBUG
